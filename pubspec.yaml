name: anchor
description: "Anchor - organize the internet into structured collections."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.13.1
  firebase_auth: ^5.5.2
  cloud_firestore: ^5.6.9
  google_sign_in: ^6.2.2

  # Cloudinary / sync
  connectivity_plus: ^6.0.0
  http: ^1.2.2

  # Database
  sqflite: ^2.3.3+1
  path: ^1.9.0

  # File handling
  path_provider: ^2.1.4
  mime: ^1.0.6

  # UI
  cupertino_icons: ^1.0.8
  flutter_screenutil: ^5.9.3
  flutter_staggered_grid_view: ^0.7.0
  cached_network_image: ^3.4.1
  photo_view: ^0.15.0
  google_fonts: ^6.2.1

  # State management
  flutter_riverpod: ^2.5.1

  # Utils
  shared_preferences: ^2.3.0
  uuid: ^4.5.1
  url_launcher: ^6.3.1
  share_plus: ^10.0.0
  open_filex: ^4.3.4
  file_picker: ^8.1.2
  intl: ^0.19.0
  video_player: ^2.9.2
  chewie: ^1.8.5
  just_audio: ^0.9.43
  flutter_pdfview: ^1.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
