name: anchor
description: "Anchor - organize the internet into structured collections."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  # Database
  sqflite: ^2.3.3+1
  path: ^1.9.0

  # File handling
  path_provider: ^2.1.4
  mime: ^1.0.6

  # UI
  flutter_staggered_grid_view: ^0.7.0
  cached_network_image: ^3.4.1
  photo_view: ^0.15.0
  google_fonts: ^6.2.1

  # State management
  flutter_riverpod: ^2.5.1

  # Utils
  uuid: ^4.5.1
  url_launcher: ^6.3.1
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
